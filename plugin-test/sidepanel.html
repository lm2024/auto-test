<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; color: #303133; background: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header { padding: 10px 14px; background: linear-gradient(135deg, #409eff, #337ecc); color: #fff; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .header h3 { font-size: 14px; font-weight: 600; }
    .btn { padding: 5px 10px; border: 1px solid rgba(255,255,255,0.5); border-radius: 4px; background: transparent; color: #fff; cursor: pointer; font-size: 12px; }
    .btn:hover { background: rgba(255,255,255,0.2); }
    .btn-recording { background: #f56c6c; border-color: #f56c6c; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(245,108,108,0.4); } 50% { box-shadow: 0 0 0 6px rgba(245,108,108,0); } }
    .toolbar { padding: 6px 12px; border-bottom: 1px solid #e4e7ed; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex-shrink: 0; background: #fafafa; }
    .filter-bar { padding: 6px 12px; border-bottom: 1px solid #e4e7ed; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex-shrink: 0; background: #fafafa; }
    .filter-bar input[type="text"] { flex: 1; min-width: 60px; padding: 4px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 12px; }
    .filter-bar select { padding: 4px 6px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 12px; background: #fff; }
    .filter-bar label { font-size: 11px; color: #606266; display: flex; align-items: center; gap: 3px; cursor: pointer; }
    .stats { padding: 5px 12px; font-size: 11px; color: #909399; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; flex-shrink: 0; }
    #apiList { flex: 1; overflow-y: auto; overflow-x: hidden; }
    .api-item { padding: 7px 12px; border-bottom: 1px solid #f5f5f5; display: flex; align-items: center; gap: 6px; }
    .api-item:hover { background: #f5f7fa; }
    .method-tag { padding: 2px 5px; border-radius: 3px; font-size: 9px; font-weight: 700; color: #fff; min-width: 32px; text-align: center; flex-shrink: 0; }
    .m-GET { background: #67c23a; } .m-POST { background: #409eff; } .m-PUT { background: #e6a23c; } .m-DELETE { background: #f56c6c; } .m-PATCH { background: #909399; }
    .api-info { flex: 1; min-width: 0; cursor: pointer; overflow: hidden; }
    .api-url { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .api-meta { font-size: 10px; color: #909399; margin-top: 1px; display: flex; gap: 6px; }
    .api-status { font-size: 9px; padding: 1px 3px; border-radius: 2px; flex-shrink: 0; }
    .st-ok { background: #f0f9eb; color: #67c23a; } .st-err { background: #fef0f0; color: #f56c6c; }
    .api-check { width: 13px; height: 13px; flex-shrink: 0; cursor: pointer; }
    .api-acts { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; }
    .api-item:hover .api-acts { opacity: 1; }
    .act-btn { padding: 1px 4px; border: none; background: none; cursor: pointer; font-size: 11px; color: #909399; border-radius: 2px; }
    .act-btn:hover { background: #e4e7ed; } .act-btn.del:hover { color: #f56c6c; }
    .empty { text-align: center; color: #909399; padding: 40px 20px; font-size: 12px; line-height: 1.8; }
    .actions { padding: 8px 12px; border-top: 1px solid #e4e7ed; display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
    .actions button { flex: 1; padding: 6px; border: 1px solid #dcdfe6; border-radius: 4px; cursor: pointer; font-size: 11px; min-width: 60px; }
    .b-primary { background: #409eff; color: #fff; border-color: #409eff; }
    .b-success { background: #67c23a; color: #fff; border-color: #67c23a; }
    .b-purple { background: #9b59b6; color: #fff; border-color: #9b59b6; }
    .b-warning { background: #e6a23c; color: #fff; border-color: #e6a23c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 99; display: none; }
    .overlay.open { display: block; }
    .panel { position: fixed; top: 0; right: -100%; width: 100%; height: 100%; background: #fff; z-index: 100; transition: right 0.25s; display: flex; flex-direction: column; }
    .panel.open { right: 0; }
    .panel-hd { padding: 10px 15px; background: #f5f7fa; border-bottom: 1px solid #e4e7ed; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .panel-hd h4 { font-size: 13px; }
    .close-btn { border: none; background: none; cursor: pointer; font-size: 18px; color: #909399; }
    .panel-bd { flex: 1; overflow-y: auto; padding: 12px 15px; }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; font-size: 12px; }
    .meta-label { color: #909399; font-size: 10px; }
    .section { margin-bottom: 12px; }
    .section-hd { font-weight: 600; font-size: 11px; color: #606266; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .section pre { background: #f5f7fa; padding: 6px 8px; border-radius: 4px; font-size: 10px; overflow: auto; max-height: 120px; white-space: pre-wrap; word-break: break-all; font-family: monospace; border: 1px solid #ebeef5; }
    .cpy-btn { padding: 1px 6px; border: 1px solid #dcdfe6; border-radius: 3px; background: #fff; cursor: pointer; font-size: 9px; }
    .dialog { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 200; display: none; justify-content: center; align-items: center; }
    .dialog.open { display: flex; }
    .dialog-box { background: #fff; border-radius: 8px; padding: 16px; width: 90%; max-width: 380px; }
    .dialog-box h4 { margin-bottom: 12px; font-size: 13px; }
    .form-g { margin-bottom: 10px; }
    .form-g label { display: block; font-size: 11px; margin-bottom: 3px; font-weight: 500; }
    .form-g input, .form-g select, .form-g textarea { width: 100%; padding: 5px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 12px; }
    .form-g textarea { resize: vertical; min-height: 80px; font-family: monospace; }
    .dialog-btns { display: flex; gap: 8px; margin-top: 12px; }
    .dialog-btns button { flex: 1; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 11px; border: 1px solid #dcdfe6; background: #fff; }
    .checkbox { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #606266; cursor: pointer; }
    /* Debugger */
    .dbg-section { margin-bottom: 10px; }
    .dbg-section-title { font-weight: 600; font-size: 11px; color: #606266; margin-bottom: 4px; }
    .dbg-input { width: 100%; padding: 5px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 12px; font-family: monospace; }
    .dbg-textarea { width: 100%; padding: 5px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 11px; font-family: monospace; min-height: 60px; resize: vertical; }
    .dbg-kv-row { display: flex; gap: 4px; margin-bottom: 4px; }
    .dbg-kv-row input { flex: 1; padding: 4px 6px; border: 1px solid #dcdfe6; border-radius: 3px; font-size: 11px; }
    .dbg-kv-row button { padding: 2px 6px; border: 1px solid #dcdfe6; border-radius: 3px; background: #fff; cursor: pointer; font-size: 10px; }
    .dbg-send { width: 100%; padding: 8px; background: #409eff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-bottom: 10px; }
    .dbg-response { background: #f5f7fa; border: 1px solid #e4e7ed; border-radius: 4px; padding: 8px; display: none; }
    .dbg-response.show { display: block; }
    .dbg-response pre { font-size: 11px; max-height: 200px; overflow: auto; white-space: pre-wrap; font-family: monospace; }
    .dbg-status { font-weight: 600; font-size: 12px; }
    .dbg-status.ok { color: #67c23a; } .dbg-status.err { color: #f56c6c; }
  </style>
</head>
<body>
  <div class="header">
    <h3>接口录制助手</h3>
    <div style="display:flex;gap:4px">
      <button class="btn" id="recordBtn">开始录制</button>
      <button class="btn" id="settingsBtn">⚙</button>
    </div>
  </div>
  <div class="filter-bar">
    <input type="checkbox" id="selectAll" style="cursor:pointer"> 
    <input type="text" id="searchInput" placeholder="搜索URL...">
    <select id="methodFilter"><option value="">全部</option><option value="GET">GET</option><option value="POST">POST</option><option value="PUT">PUT</option><option value="DELETE">DELETE</option></select>
    <select id="statusFilter"><option value="">全部</option><option value="success">2xx</option><option value="error">4xx/5xx</option></select>
    <label class="checkbox"><input type="checkbox" id="autoFilter" checked> 过滤</label>
  </div>
  <div class="stats"><span id="statsText">共 0 条</span><span id="selText">已选 0 条</span></div>
  <div id="apiList"><div class="empty" id="emptyHint">点击「开始录制」后在页面中操作</div></div>
  <div class="actions">
    <button class="b-primary" id="pushBtn" disabled>推送至平台</button>
    <button class="b-success" id="exportBtn" disabled>导出JSON</button>
    <button class="b-purple" id="genDocBtn" disabled>生成文档</button>
    <button class="b-warning" id="clearBtn" disabled>清空</button>
  </div>

  <!-- 详情面板 -->
  <div class="overlay" id="detailOverlay"></div>
  <div class="panel" id="detailPanel"><div class="panel-hd"><h4 id="detailTitle">接口详情</h4><button class="close-btn" id="detailClose">✕</button></div><div class="panel-bd" id="detailBody"></div></div>

  <!-- 设置面板 -->
  <div class="overlay" id="settingsOverlay"></div>
  <div class="panel" id="settingsPanel"><div class="panel-hd"><h4>设置</h4><button class="close-btn" id="settingsClose">✕</button></div>
    <div class="panel-bd">
      <div style="margin-bottom:16px"><div style="font-weight:600;margin-bottom:8px;border-bottom:1px solid #ebeef5;padding-bottom:4px">平台配置</div><div class="form-g"><label>后端API地址</label><input type="text" id="cfgUrl" placeholder="http://localhost:8080"></div><div class="form-g"><label>前端页面地址</label><input type="text" id="cfgFrontendUrl" placeholder="http://localhost:3000"></div></div>
      <div style="margin-bottom:16px"><div style="font-weight:600;margin-bottom:8px;border-bottom:1px solid #ebeef5;padding-bottom:4px">过滤规则</div><div class="form-g"><label>忽略URL关键词(每行一个)</label><textarea id="cfgKw"></textarea></div><div class="form-g"><label>忽略域名(每行一个)</label><textarea id="cfgDomains"></textarea></div></div>
      <div><div style="font-weight:600;margin-bottom:8px;border-bottom:1px solid #ebeef5;padding-bottom:4px">ID生成规则</div><div class="form-g"><label>模式</label><select id="cfgMode"><option value="AUTO_INCREMENT">自增</option><option value="CUSTOM">自定义</option></select></div><div class="form-g"><label>步长</label><input type="number" id="cfgStep" value="1" min="1" max="20"></div></div>
    </div>
    <div style="padding:10px 15px;border-top:1px solid #e4e7ed"><button id="saveSettingsBtn" style="width:100%;padding:7px;background:#409eff;color:#fff;border:none;border-radius:4px;cursor:pointer">保存设置</button></div>
  </div>

  <!-- 推送对话框 -->
  <div class="dialog" id="pushDialog"><div class="dialog-box"><h4>推送至测试平台</h4><div class="form-g"><label>链路名称</label><input type="text" id="pushName"></div><div class="form-g"><label>方式</label><select id="pushMode"><option value="create">新建</option><option value="append">追加</option></select></div><div class="form-g" id="pushCodeWrap" style="display:none"><label>链路编码</label><input type="text" id="pushCode"></div><div class="dialog-btns"><button id="pushCancel">取消</button><button class="b-primary" id="pushOk" style="background:#409eff;color:#fff;border:1px solid #409eff">确认推送</button></div></div></div>

  <!-- 编辑对话框 -->
  <div class="dialog" id="editDialog"><div class="dialog-box" style="max-width:280px"><h4>编辑节点名称</h4><input type="text" id="editInput" style="width:100%;padding:5px 8px;border:1px solid #dcdfe6;border-radius:4px;font-size:12px;margin-bottom:10px"><div class="dialog-btns"><button id="editCancel">取消</button><button class="b-primary" id="editOk">确定</button></div></div></div>

  <!-- 调试器对话框 -->
  <div class="dialog" id="dbgDialog"><div class="dialog-box" style="max-width:420px;max-height:80vh;overflow-y:auto"><h4>🔧 API 调试器</h4>
    <div class="dbg-section"><div class="dbg-section-title">请求地址</div><input type="text" class="dbg-input" id="dbgUrl" placeholder="https://api.example.com/endpoint"></div>
    <div class="dbg-section"><div class="dbg-section-title">请求方法</div><select class="dbg-input" id="dbgMethod" style="width:120px"><option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option><option>PATCH</option></select></div>
    <div class="dbg-section"><div class="dbg-section-title">请求头</div><div id="dbgHeaders"></div><button onclick="addDbgHeader()" style="font-size:10px;border:1px solid #dcdfe6;border-radius:3px;background:#fff;padding:2px 6px;cursor:pointer">+ 添加</button></div>
    <div class="dbg-section"><div class="dbg-section-title">请求体 (JSON)</div><textarea class="dbg-textarea" id="dbgBody" placeholder='{"key":"value"}'></textarea></div>
    <button class="dbg-send" id="dbgSend">🚀 发送请求</button>
    <div class="dbg-response" id="dbgResponse"><div style="margin-bottom:6px"><span class="dbg-status" id="dbgStatus"></span> <span id="dbgDuration" style="font-size:10px;color:#909399"></span></div><pre id="dbgResponseBody"></pre></div>
    <div class="dialog-btns" style="margin-top:8px"><button onclick="document.getElementById('dbgDialog').classList.remove('open')">关闭</button></div>
  </div></div>

  <script src="sidepanel.js"></script>
</body>
</html>
