<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 370" font-family="Segoe UI, Arial, 'Microsoft YaHei', sans-serif">
  <rect width="770" height="370" fill="#fbfcfe"/>
  <text x="385" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2d3d">登录态状态机</text>

  <defs>
    <marker id="s" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6b80"/></marker>
  </defs>

  <!-- UNKNOWN -->
  <rect x="320" y="44" width="130" height="40" rx="20" fill="#eef4ff" stroke="#3b7ddd" stroke-width="1.5"/>
  <text x="385" y="69" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f3a5f">UNKNOWN</text>

  <!-- ANONYMOUS -->
  <rect x="70" y="150" width="150" height="44" rx="22" fill="#f4f5f7" stroke="#9aa3b0" stroke-width="1.5"/>
  <text x="145" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="#46566b">ANONYMOUS</text>

  <!-- AUTHED -->
  <rect x="310" y="150" width="150" height="44" rx="22" fill="#e6f7ec" stroke="#2faa5b" stroke-width="1.5"/>
  <text x="385" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f5a37">AUTHED</text>

  <!-- EXPIRED -->
  <rect x="550" y="150" width="150" height="44" rx="22" fill="#fff4e6" stroke="#e08a2a" stroke-width="1.5"/>
  <text x="625" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a85b12">EXPIRED</text>

  <!-- MISMATCH -->
  <rect x="310" y="290" width="150" height="44" rx="22" fill="#fdeaea" stroke="#e07474" stroke-width="1.5"/>
  <text x="385" y="317" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a2b2b">MISMATCH</text>

  <!-- 转移 -->
  <line x1="320" y1="64" x2="180" y2="140" stroke="#5b6b80" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="225" y="98" font-size="10" fill="#5b6b80">无令牌</text>
  <line x1="370" y1="64" x2="370" y2="140" stroke="#2faa5b" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="377" y="98" font-size="10" fill="#2faa5b">GET /me 200</text>

  <line x1="460" y1="172" x2="545" y2="172" stroke="#e08a2a" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="500" y="166" font-size="10" fill="#e08a2a">401</text>
  <line x1="625" y1="194" x2="625" y2="300" stroke="#5b6b80" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="635" y="250" font-size="9.5" fill="#5b6b80">（路径略）</text>
  <line x1="550" y1="172" x2="465" y2="172" stroke="#2faa5b" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="500" y="188" font-size="10" fill="#2faa5b">弹登录成功</text>

  <line x1="385" y1="194" x2="385" y2="290" stroke="#e07474" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="392" y="248" font-size="10" fill="#e07474">platformUrl 变更</text>

  <line x1="310" y1="312" x2="220" y2="194" stroke="#5b6b80" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="235" y="270" font-size="10" fill="#5b6b80">清空</text>

  <line x1="310" y1="172" x2="225" y2="172" stroke="#9aa3b0" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="262" y="166" font-size="10" fill="#9aa3b0">登出</text>

  <path d="M460,150 C500,120 540,120 580,150" fill="none" stroke="#3b7ddd" stroke-width="1.5" marker-end="url(#s)"/>
  <text x="500" y="112" font-size="10" fill="#3b7ddd">临近过期 静默 refresh</text>
</svg>
