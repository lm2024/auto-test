<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 380" font-family="Segoe UI, Arial, 'Microsoft YaHei', sans-serif">
  <rect width="770" height="380" fill="#fbfcfe"/>
  <text x="385" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2d3d">三通道认证（共用同一套令牌仓库）</text>
  <text x="385" y="50" text-anchor="middle" font-size="11.5" fill="#8a98ad">三个通道最终都写入 chrome.storage.local['platformAuth']，含 boundUrl 防跨环境串用</text>

  <!-- 通道 A -->
  <rect x="24" y="70" width="232" height="250" rx="10" fill="#ffffff" stroke="#e08a2a" stroke-width="2"/>
  <rect x="24" y="70" width="232" height="38" rx="10" fill="#fbe7d2"/>
  <rect x="24" y="98" width="232" height="10" fill="#fbe7d2"/>
  <text x="140" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a85b12">A 主 · 账号密码登录</text>
  <text x="40" y="138" font-size="11.5" font-weight="700" fill="#33414f">方式</text>
  <text x="40" y="156" font-size="11" fill="#46566b">插件内表单 →</text>
  <text x="40" y="172" font-size="11" fill="#46566b">/api/captcha + /login</text>
  <text x="40" y="200" font-size="11.5" font-weight="700" fill="#33414f">适用</text>
  <text x="40" y="218" font-size="11" fill="#46566b">首次使用 / 通用</text>
  <text x="40" y="246" font-size="11.5" font-weight="700" fill="#33414f">后端改动</text>
  <text x="40" y="264" font-size="11" fill="#2faa5b" font-weight="700">无（白名单已有）</text>
  <text x="40" y="292" font-size="11.5" font-weight="700" fill="#33414f">权限</text>
  <text x="40" y="310" font-size="11" fill="#46566b">需表单 UI</text>

  <!-- 通道 B -->
  <rect x="268" y="70" width="232" height="250" rx="10" fill="#ffffff" stroke="#2faa5b" stroke-width="2"/>
  <rect x="268" y="70" width="232" height="38" rx="10" fill="#d6f3df"/>
  <rect x="268" y="98" width="232" height="10" fill="#d6f3df"/>
  <text x="384" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f5a37">B 辅 · 同步平台登录态</text>
  <text x="40" y="138" font-size="11.5" font-weight="700" fill="#33414f">方式</text>
  <text x="284" y="138" font-size="11" fill="#46566b">chrome.scripting 读平台页</text>
  <text x="284" y="154" font-size="11" fill="#46566b">localStorage['autotest_token']</text>
  <text x="284" y="182" font-size="11.5" font-weight="700" fill="#33414f">适用</text>
  <text x="284" y="200" font-size="11" fill="#46566b">已登录平台，免验证码</text>
  <text x="284" y="200" font-size="11" fill="#1f5a37" font-weight="700">（推荐体验）</text>
  <text x="284" y="228" font-size="11.5" font-weight="700" fill="#33414f">后端改动</text>
  <text x="284" y="246" font-size="11" fill="#2faa5b" font-weight="700">无</text>
  <text x="284" y="274" font-size="11.5" font-weight="700" fill="#33414f">权限</text>
  <text x="284" y="292" font-size="11" fill="#46566b">tabs+scripting+&lt;all_urls&gt;</text>
  <text x="284" y="308" font-size="11" fill="#2faa5b" font-weight="700">✓ 已具备</text>

  <!-- 通道 C -->
  <rect x="512" y="70" width="232" height="250" rx="10" fill="#ffffff" stroke="#3b7ddd" stroke-width="2"/>
  <rect x="512" y="70" width="232" height="38" rx="10" fill="#dbe7fb"/>
  <rect x="512" y="98" width="232" height="10" fill="#dbe7fb"/>
  <text x="628" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f3a5f">C 备 · 长效插件令牌</text>
  <text x="528" y="138" font-size="11.5" font-weight="700" fill="#33414f">方式</text>
  <text x="528" y="156" font-size="11" fill="#46566b">平台生成 scope=plugin</text>
  <text x="528" y="172" font-size="11" fill="#46566b">JWT，插件粘贴</text>
  <text x="528" y="200" font-size="11.5" font-weight="700" fill="#33414f">适用</text>
  <text x="528" y="218" font-size="11" fill="#46566b">内网固定终端 / 免频繁登录</text>
  <text x="528" y="246" font-size="11.5" font-weight="700" fill="#33414f">后端改动</text>
  <text x="528" y="264" font-size="11" fill="#e08a2a" font-weight="700">新增 /api/user/plugin-token</text>
  <text x="528" y="292" font-size="11.5" font-weight="700" fill="#33414f">权限</text>
  <text x="528" y="310" font-size="11" fill="#46566b">粘贴即可，免验证码</text>
</svg>
