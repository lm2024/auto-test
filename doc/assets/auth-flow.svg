<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 600" font-family="Segoe UI, Arial, 'Microsoft YaHei', sans-serif">
  <rect width="740" height="600" fill="#fbfcfe"/>
  <text x="370" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2d3d">推送时的鉴权与 401 重放流程</text>

  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3b7ddd"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e08a2a"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2faa5b"/></marker>
  </defs>

  <!-- 正常路径（蓝） -->
  <rect x="250" y="44" width="240" height="34" rx="17" fill="#3b7ddd"/><text x="370" y="66" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">点击「确认推送」</text>
  <rect x="220" y="98" width="300" height="32" rx="8" fill="#eef4ff" stroke="#9db8e0"/><text x="370" y="119" text-anchor="middle" font-size="11.5" fill="#33414f">组装 payload（含 macroActions、traceId 分组）</text>
  <rect x="220" y="148" width="300" height="32" rx="8" fill="#fff4e6" stroke="#f0b27a"/><text x="370" y="169" text-anchor="middle" font-size="11.5" fill="#a85b12" font-weight="700">暂存 pendingRequest（上下文保护，数据零丢失）</text>

  <!-- 菱形 令牌有效 -->
  <polygon points="370,206 440,236 370,266 300,236" fill="#eef4ff" stroke="#3b7ddd" stroke-width="1.5"/>
  <text x="370" y="232" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f3a5f">令牌有效?</text>
  <text x="448" y="230" font-size="11" fill="#2faa5b" font-weight="700">是</text>
  <text x="292" y="290" font-size="11" fill="#e08a2a" font-weight="700" text-anchor="end">否 / 401</text>

  <!-- 右侧 成功路径 -->
  <rect x="500" y="206" width="210" height="32" rx="8" fill="#eef4ff" stroke="#9db8e0"/><text x="605" y="227" text-anchor="middle" font-size="11.5" fill="#33414f">注入 Authorization: Bearer</text>
  <rect x="500" y="252" width="210" height="32" rx="8" fill="#eef4ff" stroke="#9db8e0"/><text x="605" y="273" text-anchor="middle" font-size="11.5" fill="#33414f">fetch POST /api/plugin/chain</text>
  <polygon points="605,300 675,330 605,360 535,330" fill="#eef4ff" stroke="#3b7ddd" stroke-width="1.5"/>
  <text x="605" y="326" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f3a5f">响应 200?</text>
  <text x="683" y="334" font-size="11" fill="#2faa5b" font-weight="700">是</text>
  <rect x="500" y="392" width="210" height="34" rx="17" fill="#2faa5b"/><text x="605" y="414" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">推送成功 ✓</text>

  <!-- 网络异常分支 -->
  <rect x="500" y="470" width="210" height="40" rx="8" fill="#fdeaea" stroke="#e07474"/><text x="605" y="488" text-anchor="middle" font-size="11" fill="#9a2b2b" font-weight="700">NETWORK：后端不可达</text><text x="605" y="503" text-anchor="middle" font-size="10.5" fill="#9a2b2b">（不清除令牌，与未登录严格区分）</text>

  <!-- 左侧 401 / 登录路径 -->
  <rect x="40" y="296" width="220" height="32" rx="8" fill="#fff4e6" stroke="#f0b27a"/><text x="150" y="317" text-anchor="middle" font-size="11.5" fill="#a85b12" font-weight="700">打开登录面板（保留输入框）</text>
  <polygon points="150,344 220,374 150,404 80,374" fill="#fff4e6" stroke="#e08a2a" stroke-width="1.5"/>
  <text x="150" y="370" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a85b12">登录成功?</text>
  <text x="228" y="378" font-size="11" fill="#2faa5b" font-weight="700">是</text>
  <text x="72" y="438" font-size="11" fill="#9a9a9a" font-weight="700" text-anchor="end">取消</text>
  <rect x="40" y="418" width="220" height="34" rx="8" fill="#eef4ff" stroke="#9db8e0"/><text x="150" y="440" text-anchor="middle" font-size="11.5" fill="#33414f">自动重放 pendingRequest</text>
  <text x="150" y="462" text-anchor="middle" font-size="10" fill="#7a8aa0">(retryOn401=false 防死循环)</text>
  <rect x="40" y="498" width="220" height="40" rx="8" fill="#f4f5f7" stroke="#c2c8d0"/><text x="150" y="516" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="700">提示已取消，录制数据仍在</text>

  <!-- 连接线 -->
  <line x1="370" y1="78" x2="370" y2="98" stroke="#3b7ddd" stroke-width="2" marker-end="url(#b)"/>
  <line x1="370" y1="130" x2="370" y2="148" stroke="#3b7ddd" stroke-width="2" marker-end="url(#b)"/>
  <line x1="370" y1="180" x2="370" y2="206" stroke="#3b7ddd" stroke-width="2" marker-end="url(#b)"/>
  <line x1="440" y1="236" x2="500" y2="222" stroke="#2faa5b" stroke-width="2" marker-end="url(#g)"/>
  <line x1="605" y1="238" x2="605" y2="252" stroke="#3b7ddd" stroke-width="2" marker-end="url(#b)"/>
  <line x1="605" y1="284" x2="605" y2="300" stroke="#3b7ddd" stroke-width="2" marker-end="url(#b)"/>
  <line x1="675" y1="330" x2="710" y2="330" stroke="#2faa5b" stroke-width="2" marker-end="url(#g)"/>
  <line x1="710" y1="330" x2="710" y2="409" stroke="#2faa5b" stroke-width="2"/>
  <line x1="710" y1="409" x2="710" y2="490" stroke="#9a2b2b" stroke-width="2" marker-end="url(#o)"/>
  <line x1="710" y1="490" x2="710" y2="409" stroke="#9a2b2b" stroke-width="1.5"/>
  <line x1="300" y1="266" x2="230" y2="312" stroke="#e08a2a" stroke-width="2" marker-end="url(#o)"/>
  <line x1="150" y1="328" x2="150" y2="344" stroke="#e08a2a" stroke-width="2" marker-end="url(#o)"/>
  <line x1="220" y1="374" x2="280" y2="374" stroke="#2faa5b" stroke-width="2" marker-end="url(#g)"/>
  <line x1="150" y1="404" x2="150" y2="418" stroke="#e08a2a" stroke-width="2" marker-end="url(#o)"/>
  <line x1="260" y1="435" x2="500" y2="268" stroke="#2faa5b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <line x1="80" y1="374" x2="40" y2="468" stroke="#9a9a9a" stroke-width="1.8" marker-end="url(#o)"/>
</svg>
