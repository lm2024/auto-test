<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; color: #303133; background: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header { padding: 10px 14px; background: linear-gradient(135deg, #409eff, #337ecc); color: #fff; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .header h3 { font-size: 14px; font-weight: 600; }
    .btn { padding: 5px 12px; border: 1px solid rgba(255,255,255,0.5); border-radius: 4px; background: transparent; color: #fff; cursor: pointer; font-size: 12px; }
    .btn:hover { background: rgba(255,255,255,0.2); }
    .btn-recording { background: #f56c6c; border-color: #f56c6c; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(245,108,108,0.4); } 50% { box-shadow: 0 0 0 6px rgba(245,108,108,0); } }
    .filter-bar { padding: 8px 12px; border-bottom: 1px solid #e4e7ed; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex-shrink: 0; background: #fafafa; }
    .filter-bar input[type="text"] { flex: 1; min-width: 60px; padding: 5px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 12px; }
    .filter-bar select { padding: 5px 6px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 12px; background: #fff; }
    .filter-bar label { font-size: 11px; color: #606266; display: flex; align-items: center; gap: 3px; cursor: pointer; white-space: nowrap; }
    .stats { padding: 6px 12px; font-size: 11px; color: #909399; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; flex-shrink: 0; }
    #apiList { flex: 1; overflow-y: auto; overflow-x: hidden; }
    .api-item { padding: 8px 12px; border-bottom: 1px solid #f5f5f5; display: flex; align-items: center; gap: 8px; }
    .api-item:hover { background: #f5f7fa; }
    .method-tag { padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 700; color: #fff; min-width: 36px; text-align: center; flex-shrink: 0; }
    .m-GET { background: #67c23a; } .m-POST { background: #409eff; } .m-PUT { background: #e6a23c; } .m-DELETE { background: #f56c6c; }
    .api-info { flex: 1; min-width: 0; cursor: pointer; overflow: hidden; }
    .api-url { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .api-meta { font-size: 10px; color: #909399; margin-top: 2px; display: flex; gap: 8px; }
    .api-status { font-size: 10px; padding: 1px 4px; border-radius: 2px; flex-shrink: 0; }
    .st-ok { background: #f0f9eb; color: #67c23a; } .st-err { background: #fef0f0; color: #f56c6c; }
    .api-check { width: 14px; height: 14px; flex-shrink: 0; cursor: pointer; }
    .api-acts { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; }
    .api-item:hover .api-acts { opacity: 1; }
    .act-btn { padding: 2px 5px; border: none; background: none; cursor: pointer; font-size: 12px; color: #909399; }
    .act-btn:hover { background: #e4e7ed; } .act-btn.del:hover { color: #f56c6c; }
    .empty { text-align: center; color: #909399; padding: 40px 20px; font-size: 12px; line-height: 1.8; }
    .actions { padding: 10px 12px; border-top: 1px solid #e4e7ed; display: flex; gap: 8px; flex-shrink: 0; }
    .actions button { flex: 1; padding: 7px; border: 1px solid #dcdfe6; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .b-primary { background: #409eff; color: #fff; border-color: #409eff; }
    .b-success { background: #67c23a; color: #fff; border-color: #67c23a; }
    .b-danger { background: #fff; color: #f56c6c; border-color: #f56c6c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 99; display: none; }
    .overlay.open { display: block; }
    .panel { position: fixed; top: 0; right: -100%; width: 100%; height: 100%; background: #fff; z-index: 100; transition: right 0.25s; display: flex; flex-direction: column; }
    .panel.open { right: 0; }
    .panel-hd { padding: 10px 15px; background: #f5f7fa; border-bottom: 1px solid #e4e7ed; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .panel-hd h4 { font-size: 13px; }
    .close-btn { border: none; background: none; cursor: pointer; font-size: 18px; color: #909399; padding: 4px; }
    .panel-bd { flex: 1; overflow-y: auto; padding: 12px 15px; }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; font-size: 12px; }
    .meta-label { color: #909399; font-size: 11px; }
    .section { margin-bottom: 14px; }
    .section-hd { font-weight: 600; font-size: 12px; color: #606266; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .section pre { background: #f5f7fa; padding: 8px; border-radius: 4px; font-size: 11px; overflow: auto; max-height: 150px; white-space: pre-wrap; word-break: break-all; font-family: monospace; border: 1px solid #ebeef5; }
    .cpy-btn { padding: 2px 8px; border: 1px solid #dcdfe6; border-radius: 3px; background: #fff; cursor: pointer; font-size: 10px; }
    .dialog { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 200; display: none; justify-content: center; align-items: center; }
    .dialog.open { display: flex; }
    .dialog-box { background: #fff; border-radius: 8px; padding: 20px; width: 90%; max-width: 340px; }
    .dialog-box h4 { margin-bottom: 15px; font-size: 14px; }
    .form-g { margin-bottom: 12px; }
    .form-g label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: 500; }
    .form-g input, .form-g select, .form-g textarea { width: 100%; padding: 6px 10px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 12px; }
    .form-g textarea { resize: vertical; min-height: 60px; font-family: inherit; }
    .dialog-btns { display: flex; gap: 8px; margin-top: 15px; }
    .dialog-btns button { flex: 1; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid #dcdfe6; background: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <h3>接口录制助手</h3>
    <div style="display:flex;gap:6px">
      <button class="btn" id="recordBtn">开始录制</button>
      <button class="btn" id="settingsBtn">⚙</button>
    </div>
  </div>
  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="搜索URL...">
    <select id="methodFilter"><option value="">全部</option><option value="GET">GET</option><option value="POST">POST</option><option value="PUT">PUT</option><option value="DELETE">DELETE</option></select>
    <select id="statusFilter"><option value="">全部</option><option value="success">2xx</option><option value="error">4xx/5xx</option></select>
    <label><input type="checkbox" id="autoFilter" checked> 过滤</label>
  </div>
  <div class="stats"><span id="statsText">共 0 条</span><span id="selText">已选 0 条</span></div>
  <div id="apiList">
    <div class="empty" id="emptyHint">点击「开始录制」后<br>在页面中操作接口将自动捕获</div>
  </div>
  <div class="actions">
    <button class="b-primary" id="pushBtn" disabled>推送至平台</button>
    <button class="b-success" id="exportBtn" disabled>导出JSON</button>
    <button class="b-danger" id="clearBtn" disabled>清空</button>
  </div>

  <div class="overlay" id="detailOverlay"></div>
  <div class="panel" id="detailPanel"><div class="panel-hd"><h4>接口详情</h4><button class="close-btn" id="detailClose">✕</button></div><div class="panel-bd" id="detailBody"></div></div>
  <div class="overlay" id="settingsOverlay"></div>
  <div class="panel" id="settingsPanel"><div class="panel-hd"><h4>设置</h4><button class="close-btn" id="settingsClose">✕</button></div>
    <div class="panel-bd">
      <div style="margin-bottom:20px"><div style="font-weight:600;margin-bottom:12px;border-bottom:1px solid #ebeef5;padding-bottom:6px">平台配置</div><div class="form-g"><label>测试平台地址</label><input type="text" id="cfgUrl" placeholder="http://localhost:8080"></div></div>
      <div style="margin-bottom:20px"><div style="font-weight:600;margin-bottom:12px;border-bottom:1px solid #ebeef5;padding-bottom:6px">过滤规则</div><div class="form-g"><label>忽略URL关键词(每行一个)</label><textarea id="cfgKw"></textarea></div><div class="form-g"><label>忽略域名(每行一个)</label><textarea id="cfgDomains"></textarea></div></div>
      <div><div style="font-weight:600;margin-bottom:12px;border-bottom:1px solid #ebeef5;padding-bottom:6px">ID生成规则</div><div class="form-g"><label>模式</label><select id="cfgMode"><option value="AUTO_INCREMENT">自增</option><option value="CUSTOM">自定义</option></select></div><div class="form-g"><label>步长</label><input type="number" id="cfgStep" value="1" min="1" max="20"></div></div>
    </div>
    <div style="padding:12px 15px;border-top:1px solid #e4e7ed"><button id="saveSettingsBtn" style="width:100%;padding:8px;background:#409eff;color:#fff;border:none;border-radius:4px;cursor:pointer">保存设置</button></div>
  </div>

  <div class="dialog" id="pushDialog"><div class="dialog-box"><h4>推送至测试平台</h4><div class="form-g"><label>链路名称</label><input type="text" id="pushName"></div><div class="form-g"><label>方式</label><select id="pushMode"><option value="create">新建</option><option value="append">追加</option></select></div><div class="form-g" id="pushCodeWrap" style="display:none"><label>链路编码</label><input type="text" id="pushCode"></div><div class="dialog-btns"><button id="pushCancel">取消</button><button class="b-primary" id="pushOk">确认</button></div></div></div>
  <div class="dialog" id="editDialog"><div class="dialog-box" style="max-width:300px"><h4>编辑节点名称</h4><input type="text" id="editInput" style="width:100%;padding:6px 10px;border:1px solid #dcdfe6;border-radius:4px;font-size:12px;margin-bottom:12px"><div class="dialog-btns"><button id="editCancel">取消</button><button class="b-primary" id="editOk">确定</button></div></div></div>

  <script src="sidepanel.js"></script>
</body>
</html>
