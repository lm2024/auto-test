server:
  port: 8080
  servlet:
    context-path: /
  servlet.encoding:
    charset: UTF-8
    enabled: true
    force: true
    force-request: true
    force-response: true

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auto_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: autotest123
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000;characterEncoding=UTF-8

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.autotest.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.autotest: debug

ai:
  base-url: http://localhost:11434/v1
  api-key: sk-placeholder
  model: qwen-max
  timeout-seconds: 120
  max-retries: 1

# 测试账号密码 AES 加密密钥（必须为16字节）
account:
  aes-key: autotest_key_16!

# JWT 配置
jwt:
  secret: auto-test-jwt-secret-key-2026
  expiration: 86400000

# SSO OAuth2 配置
sso:
  enabled: false
  client-id: your-client-id
  client-secret: your-client-secret
  authorize-url: https://sso.company.com/oauth2/authorize
  token-url: https://sso.company.com/oauth2/token
  user-info-url: https://sso.company.com/oauth2/userinfo
  redirect-uri: http://localhost:3001/api/sso/callback
