server:
  port: 8080
  servlet:
    context-path: /

spring:
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auto_test?useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_general_ci
    username: root
    password: autotest123
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      connection-init-sqls:
        - SET NAMES utf8mb4

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.autotest.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.autotest: debug

ai:
  base-url: http://localhost:11434/v1
  api-key: sk-placeholder
  model: qwen-max
  timeout-seconds: 120
  max-retries: 1

# 测试账号密码 AES 加密密钥（必须为16字节）
account:
  aes-key: autotest_key_16!

browser:
  automation:
    headless: true
    browser-type: chromium
    screenshot-dir: ./screenshots
    screenshot-format: png
    default-timeout: 30000
    default-wait: 500
    max-sessions: 5
    cleanup-hours: 24
