server:
  port: 9093
  servlet:
    context-path: /
  servlet.encoding:
    charset: UTF-8
    enabled: true
    force: true
    force-request: true
    force-response: true

# 开发环境验证码绕过（仅用于接口测试）
captcha:
  bypass: true

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auto_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: "AutoTest2026Kp9&Xz*"
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000;characterEncoding=UTF-8

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.autotest.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.autotest: debug

ai:
  base-url: http://localhost:11434/v1
  api-key: sk-placeholder
  model: qwen-max
  timeout-seconds: 120
  max-retries: 1

# ============ 安全相关配置 ============
# 判定标准：纯内网 + 网络/机器完全可信 + 测试账号不是真实生产凭证 → 下面【可不改】项保持默认也能跑。
# 若任一条件不满足（内网有不可信终端 / 机器可能被他人登录 / 存了真实账号密码）→ 建议把【建议改】项换成自定义随机值。

# 测试账号密码 AES 加密密钥（必须为16字节 ASCII）
# 【可不改，但建议改】当前是公开仓库默认值；内网不可信或含真实凭证时务必改，否则密钥等于透明
account:
  aes-key: autotest_key_16!

# JWT 配置（登录 token 签发）
# 【可不改，但建议改】secret 同样是公开默认值；不可信环境建议改，否则他人可伪造登录 token
jwt:
  secret: auto-test-jwt-secret-key-2026
  expiration: 86400000   # token 有效期（毫秒）：86400000 = 24小时，可按需调长/调短

# SSO OAuth2 配置（单点登录）
# 【无需改、整段可删】enabled=false 时以下子项全部不生效，都是占位示例域名，删了后端照样启动
sso:
  enabled: false
  # client-id: your-client-id
  # client-secret: your-client-secret
  # authorize-url: https://sso.company.com/oauth2/authorize
  # token-url: https://sso.company.com/oauth2/token
  # user-info-url: https://sso.company.com/oauth2/userinfo
  # redirect-uri: http://localhost:9094/api/sso/callback
