# ==============================================================================
#  AutoTest 前端 Nginx 配置文件
#  适用: ARM64 (aarch64) Linux，纯内网，无外网
#  Nginx 版本: 1.26.2 (静态链接二进制，位于 ../sbin/nginx)
# ==============================================================================
#
#  ★ 本配置文件使用「相对路径」，运行时必须以 nginx 目录为「前缀(prefix)」启动：
#      ./sbin/nginx -p /完整路径/frontend/nginx -c conf/nginx.conf
#    相对路径都相对于 nginx 目录本身，因此拷贝到任何目录都能用，无需改绝对路径。
#
#  ★ 路径约定（拷贝后保持此相对结构即可）：
#      frontend/nginx/            <- 当前目录（prefix）
#      frontend/nginx/sbin/nginx  <- 二进制
#      frontend/nginx/conf/       <- 本文件 + mime.types
#      frontend/nginx/logs/       <- 运行日志
#      frontend/dist/             <- 前端构建产物（npm run build 生成）
#
#  ★ 只需要改的地方，已用【修改这里】标出；其余【不用修改】保持原样即可。
#
# ==============================================================================

# ----------------------------------------------------------------------------
# 全局块（一般【不用修改】）
# ----------------------------------------------------------------------------
# 工作进程数：auto = 按 CPU 核心数自动设置，ARM 多核服务器会自动吃满
worker_processes  auto;

# 错误日志：相对路径 logs/ 在 nginx 目录下（运行时自动创建）
error_log  logs/error.log  warn;

# 进程号记录文件
pid        logs/nginx.pid;


# ----------------------------------------------------------------------------
# 事件块（一般【不用修改】）
# ----------------------------------------------------------------------------
events {
    # 单个 worker 最大连接数
    worker_connections  1024;
}


# ----------------------------------------------------------------------------
# HTTP 核心配置
# ----------------------------------------------------------------------------
http {
    # MIME 类型映射表：相对路径 conf/mime.types（已随包提供）
    # 【不用修改】
    include       mime.types;
    default_type  application/octet-stream;

    # 日志格式（【不用修改】）
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  logs/access.log  main;

    # 提升性能的基础设置（【不用修改】）
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # 上传文件大小上限（前端可能上传插件 jar 等，给大一点）（【不用修改】）
    client_max_body_size 100m;

    # 开启 gzip 压缩，前端 JS/CSS 体积大，压缩后加载更快（【不用修改】）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ========================================================================
    #  虚拟主机：前端站点 + 后端反向代理
    # ========================================================================
    server {
        # 【修改这里】监听端口。默认 80（需 root 权限）。
        #   如果不用 root 运行、或 80 被占用，改成其它端口，例如 8081，
        #   部署后访问 http://服务器IP:端口 即可。
        listen       80;

        # 【修改这里】服务器名。内网一般用 IP 访问，填 _ 表示匹配任意主机名即可；
        #   若有域名可填域名，如 server_name  autotest.company.com;
        server_name  _;

        # 前端字符集
        charset utf-8;

        # --------------------------------------------------------------------
        # 前端静态文件服务
        # --------------------------------------------------------------------
        # 【修改这里】前端构建产物的根目录。
        #   默认用相对路径 ../dist，即 nginx 目录的同级 dist（frontend/dist）。
        #   如果你的 dist 放在别处，改成绝对路径，例如：
        #     root /opt/autotest/frontend/dist;
        #   【不用修改】前提：你已在该目录执行过 npm run build 生成 dist/
        root   ../dist;

        # 默认首页
        index  index.html;

        # --------------------------------------------------------------------
        # 前端页面路由（Vue 用 History 模式，刷新子页面需要 fallback 到 index.html）
        # 【不用修改】
        # --------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # --------------------------------------------------------------------
        # 后端 API 反向代理
        #   前端所有以 /api/ 开头的请求，转发给后端 Spring Boot 服务
        # --------------------------------------------------------------------
        location /api/ {
            # 【修改这里】后端服务地址。
            #   默认假设后端和 Nginx 在同一台机器，后端端口 9093。
            #   如果后端在另一台机器，把 127.0.0.1 改成后端服务器的内网 IP，例如：
            #     proxy_pass http://192.168.1.100:9093;
            #   注意：结尾不要加斜杠，否则会把 /api/ 前缀吞掉。
            proxy_pass http://127.0.0.1:9093;

            # 以下为代理通用头设置，【不用修改】
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 后端执行测试可能耗时较长，延长超时（【不用修改】）
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # --------------------------------------------------------------------
        # WebSocket 反向代理（执行测试时后端实时推送日志用）
        #   路径对应后端 @ServerEndpoint("/ws/execute/{executionId}")
        # --------------------------------------------------------------------
        location /ws/ {
            # 【修改这里】同 /api/，与后端地址保持一致
            proxy_pass http://127.0.0.1:9093;

            # WebSocket 必须升级协议，【不用修改】
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # WebSocket 长连接，超时设长一点，【不用修改】
            proxy_read_timeout 86400s;
        }

        # --------------------------------------------------------------------
        # 浏览器插件下载页（前端 /plugin/download 页面会用到，静态文件）
        # 【不用修改】
        # --------------------------------------------------------------------
        location /plugin/ {
            # 插件静态文件若放在 dist 下则会随前端一起服务，无需额外配置
            try_files $uri $uri/ /index.html;
        }
    }
}
