<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef4f3"/>
    </linearGradient>
    <linearGradient id="teal2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8576"/>
      <stop offset="1" stop-color="#4a9e8e"/>
    </linearGradient>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2d3d" flood-opacity="0.14"/>
    </filter>
    <marker id="arr2" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 L9 4 L0 8 Z" fill="#4a9e8e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="460" rx="22" fill="url(#bg2)"/>
  <circle cx="44" cy="46" r="11" fill="url(#teal2)"/>
  <text x="64" y="52" font-size="20" font-weight="700" fill="#1f2d3d">可视化流程编排</text>
  <text x="64" y="74" font-size="13" fill="#64748b">拖拽节点，像搭积木一样组装测试链路</text>

  <!-- 画布网格 -->
  <g stroke="#e8eef0" stroke-width="1">
    <line x1="40" y1="120" x2="680" y2="120"/>
    <line x1="40" y1="180" x2="680" y2="180"/>
    <line x1="40" y1="240" x2="680" y2="240"/>
    <line x1="40" y1="300" x2="680" y2="300"/>
    <line x1="40" y1="360" x2="680" y2="360"/>
    <line x1="160" y1="100" x2="160" y2="380"/>
    <line x1="360" y1="100" x2="360" y2="380"/>
    <line x1="560" y1="100" x2="560" y2="380"/>
  </g>

  <!-- 连接线 -->
  <path d="M150 230 C210 230 210 170 270 170" fill="none" stroke="#4a9e8e" stroke-width="3" marker-end="url(#arr2)"/>
  <path d="M400 170 C460 170 460 290 520 290" fill="none" stroke="#4a9e8e" stroke-width="3" marker-end="url(#arr2)"/>
  <path d="M610 290 C650 290 650 230 660 230" fill="none" stroke="#4a9e8e" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- 开始节点 -->
  <g filter="url(#sh2)">
    <circle cx="110" cy="230" r="34" fill="#ffffff" stroke="#4a9e8e" stroke-width="2.5"/>
    <circle cx="110" cy="230" r="10" fill="#4a9e8e"/>
    <text x="110" y="285" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2d3d">开始</text>
  </g>

  <!-- HTTP请求节点 -->
  <g filter="url(#sh2)">
    <rect x="190" y="138" width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="190" y="138" width="6" height="64" rx="3" fill="#4a9e8e"/>
    <text x="214" y="166" font-size="15" font-weight="600" fill="#1f2d3d">HTTP 请求</text>
    <text x="214" y="188" font-size="12" fill="#64748b">POST /api/login</text>
    <!-- 拖拽手柄 -->
    <circle cx="340" cy="152" r="4" fill="#cbd5e1"/>
    <circle cx="340" cy="170" r="4" fill="#cbd5e1"/>
    <circle cx="340" cy="188" r="4" fill="#cbd5e1"/>
  </g>

  <!-- 断言节点 -->
  <g filter="url(#sh2)">
    <rect x="440" y="258" width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="440" y="258" width="6" height="64" rx="3" fill="#f59e0b"/>
    <text x="464" y="286" font-size="15" font-weight="600" fill="#1f2d3d">断言校验</text>
    <text x="464" y="308" font-size="12" fill="#64748b">status == 200</text>
    <circle cx="590" cy="272" r="4" fill="#cbd5e1"/>
    <circle cx="590" cy="290" r="4" fill="#cbd5e1"/>
    <circle cx="590" cy="308" r="4" fill="#cbd5e1"/>
  </g>

  <!-- 结束节点 -->
  <g filter="url(#sh2)">
    <circle cx="660" cy="230" r="34" fill="#ffffff" stroke="#22c55e" stroke-width="2.5"/>
    <path d="M648 230 L657 240 L674 220" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="660" y="285" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2d3d">结束</text>
  </g>

  <!-- 底部提示 -->
  <rect x="40" y="396" width="640" height="34" rx="10" fill="#e6f4f1"/>
  <text x="60" y="418" font-size="13" fill="#3a8576">● 节点支持：HTTP / 数据库 / 延时 / 自定义脚本，自由组合</text>
</svg>
