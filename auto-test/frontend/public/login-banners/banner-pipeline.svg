<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef4f3"/>
    </linearGradient>
    <linearGradient id="teal1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8576"/>
      <stop offset="1" stop-color="#4a9e8e"/>
    </linearGradient>
    <filter id="sh1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1f2d3d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="720" height="460" rx="22" fill="url(#bg1)"/>

  <!-- 顶部标题栏 -->
  <circle cx="44" cy="46" r="11" fill="url(#teal1)"/>
  <text x="64" y="52" font-size="20" font-weight="700" fill="#1f2d3d">自动化测试流水线</text>
  <text x="64" y="74" font-size="13" fill="#64748b">从用例到报告，一键跑通质量闭环</text>

  <!-- 流水线四阶段 -->
  <g>
    <!-- 阶段1 -->
    <rect x="40" y="120" width="135" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh1)"/>
    <circle cx="78" cy="158" r="18" fill="#e6f4f1"/>
    <text x="78" y="164" font-size="18" text-anchor="middle" fill="#3a8576" font-weight="700">✎</text>
    <text x="112" y="152" font-size="15" font-weight="600" fill="#1f2d3d">用例编写</text>
    <text x="112" y="174" font-size="12" fill="#94a3b8">可视化编排</text>
    <text x="58" y="212" font-size="12" fill="#64748b">● 接口 / 场景</text>
    <text x="58" y="230" font-size="12" fill="#64748b">● 参数化数据</text>

    <!-- 箭头 -->
    <path d="M180 180 L200 180" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr)"/>
    <!-- 阶段2 运行中 -->
    <rect x="205" y="120" width="135" height="120" rx="14" fill="#ffffff" stroke="#4a9e8e" stroke-width="2" filter="url(#sh1)"/>
    <circle cx="243" cy="158" r="18" fill="#e6f4f1"/>
    <g transform="translate(243,158)">
      <circle r="13" fill="none" stroke="#4a9e8e" stroke-width="3" stroke-dasharray="40 60" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -7 L0 7 M-7 0 L7 0" stroke="#3a8576" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="277" y="152" font-size="15" font-weight="600" fill="#1f2d3d">调度执行</text>
    <text x="277" y="174" font-size="12" fill="#94a3b8">并发运行中</text>
    <text x="223" y="212" font-size="12" fill="#64748b">● 128 用例</text>
    <text x="223" y="230" font-size="12" fill="#22c55e" font-weight="600">● 进行中…</text>

    <path d="M345 180 L365 180" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr)"/>
    <!-- 阶段3 -->
    <rect x="370" y="120" width="135" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh1)"/>
    <circle cx="408" cy="158" r="18" fill="#e6f4f1"/>
    <text x="408" y="164" font-size="18" text-anchor="middle" fill="#3a8576" font-weight="700">✓</text>
    <text x="442" y="152" font-size="15" font-weight="600" fill="#1f2d3d">断言校验</text>
    <text x="442" y="174" font-size="12" fill="#94a3b8">状态码/正文</text>
    <text x="388" y="212" font-size="12" fill="#64748b">● 响应比对</text>
    <text x="388" y="230" font-size="12" fill="#64748b">● Schema 校验</text>

    <path d="M510 180 L530 180" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr)"/>
    <!-- 阶段4 -->
    <rect x="535" y="120" width="145" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh1)"/>
    <circle cx="573" cy="158" r="18" fill="#e6f4f1"/>
    <text x="573" y="165" font-size="18" text-anchor="middle" fill="#3a8576" font-weight="700">▦</text>
    <text x="607" y="152" font-size="15" font-weight="600" fill="#1f2d3d">报告分析</text>
    <text x="607" y="174" font-size="12" fill="#94a3b8">趋势可视化</text>
    <text x="553" y="212" font-size="12" fill="#64748b">● 通过率 97%</text>
    <text x="553" y="230" font-size="12" fill="#ef4444">● 失败 3</text>
  </g>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <!-- 底部统计条 -->
  <rect x="40" y="300" width="640" height="110" rx="16" fill="#0f1729"/>
  <text x="68" y="338" font-size="13" fill="#94a3b8">本次执行概览</text>
  <g font-family="inherit">
    <text x="68" y="378" font-size="30" font-weight="800" fill="#22c55e">128</text>
    <text x="68" y="398" font-size="12" fill="#64748b">通过</text>

    <text x="220" y="378" font-size="30" font-weight="800" fill="#ef4444">3</text>
    <text x="220" y="398" font-size="12" fill="#64748b">失败</text>

    <text x="372" y="378" font-size="30" font-weight="800" fill="#4a9e8e">97%</text>
    <text x="372" y="398" font-size="12" fill="#64748b">通过率</text>

    <text x="524" y="378" font-size="30" font-weight="800" fill="#f59e0b">42s</text>
    <text x="524" y="398" font-size="12" fill="#64748b">总耗时</text>
  </g>
  <rect x="600" y="328" width="58" height="44" rx="10" fill="#16324a"/>
  <text x="629" y="356" font-size="13" text-anchor="middle" fill="#7dd3fc">导出</text>
</svg>
