<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef4f3"/>
    </linearGradient>
    <linearGradient id="teal5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8576"/>
      <stop offset="1" stop-color="#4a9e8e"/>
    </linearGradient>
    <filter id="sh5" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1f2d3d" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="720" height="460" rx="22" fill="url(#bg5)"/>
  <circle cx="44" cy="46" r="11" fill="url(#teal5)"/>
  <text x="64" y="52" font-size="20" font-weight="700" fill="#1f2d3d">新手三步上手</text>
  <text x="64" y="74" font-size="13" fill="#64748b">三分钟，跑通你的第一个自动化测试</text>

  <!-- 步骤1 -->
  <g filter="url(#sh5)">
    <rect x="50" y="140" width="185" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="142" cy="200" r="34" fill="url(#teal5)"/>
    <text x="142" y="214" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff">1</text>
    <text x="142" y="270" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2d3d">创建测试链路</text>
    <text x="142" y="298" font-size="13" text-anchor="middle" fill="#64748b">新建一条接口</text>
    <text x="142" y="318" font-size="13" text-anchor="middle" fill="#64748b">自动化链路</text>
    <rect x="92" y="332" width="100" height="8" rx="4" fill="#eef2f4"/>
  </g>

  <!-- 箭头 -->
  <path d="M240 250 L258 250" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr5)"/>

  <!-- 步骤2 -->
  <g filter="url(#sh5)">
    <rect x="268" y="140" width="185" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="360" cy="200" r="34" fill="url(#teal5)"/>
    <text x="360" y="214" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff">2</text>
    <text x="360" y="270" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2d3d">拖拽编排节点</text>
    <text x="360" y="298" font-size="13" text-anchor="middle" fill="#64748b">请求 / 断言 /</text>
    <text x="360" y="318" font-size="13" text-anchor="middle" fill="#64748b">数据库自由组合</text>
    <rect x="310" y="332" width="100" height="8" rx="4" fill="#eef2f4"/>
  </g>

  <path d="M458 250 L476 250" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr5)"/>

  <!-- 步骤3 -->
  <g filter="url(#sh5)">
    <rect x="486" y="140" width="185" height="220" rx="18" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <circle cx="578" cy="200" r="34" fill="#22c55e"/>
    <text x="578" y="214" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff">3</text>
    <text x="578" y="270" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2d3d">一键执行</text>
    <text x="578" y="298" font-size="13" text-anchor="middle" fill="#64748b">实时查看报告</text>
    <text x="578" y="318" font-size="13" text-anchor="middle" fill="#64748b">与趋势分析</text>
    <rect x="528" y="332" width="100" height="8" rx="4" fill="#dcfce7"/>
  </g>

  <defs>
    <marker id="arr5" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect x="50" y="396" width="620" height="36" rx="10" fill="#0f1729"/>
  <text x="70" y="419" font-size="13" fill="#e2e8f0">● 无需写代码，可视化完成接口自动化，测试人员也能轻松上手</text>
</svg>
